name: Publish next beta

on:
  workflow_dispatch:
    inputs:
      version:
        description: Base version for the beta release (for example 1.1.0)
        required: true
        default: 1.1.0
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-beta
  cancel-in-progress: false

jobs:
  beta:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout main with tags
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Validate version and calculate next beta tag
        id: version
        shell: bash
        env:
          BASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid base version: $BASE_VERSION"
            exit 1
          fi

          git fetch --force --tags origin

          prefix="v${BASE_VERSION}-beta."
          last="$(
            git tag -l "${prefix}*" |
            sed -n "s/^v${BASE_VERSION}-beta\.\([0-9][0-9]*\)$/\1/p" |
            sort -n |
            tail -1
          )"

          if [[ -z "$last" ]]; then
            next=1
          else
            next=$((last + 1))
          fi

          tag="${prefix}${next}"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag already exists: $tag"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${BASE_VERSION}-beta.${next}" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag from $(git rev-parse HEAD)"

      - name: Create and push beta tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "SIDINET Dashboard $TAG"
          git push origin "$TAG"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sidinet-apps/sidinet-dashboard-docker
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push multiarch beta image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}
            COMMIT=${{ github.sha }}

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: SIDINET Dashboard ${{ steps.version.outputs.tag }}
          prerelease: true
          generate_release_notes: true
