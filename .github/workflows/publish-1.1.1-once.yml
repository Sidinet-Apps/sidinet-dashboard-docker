name: Publish 1.1.1 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-1.1.1-once.yml']
permissions:
  contents: write
  packages: write
jobs:
  publish:
    if: ${{ github.event.head_commit.message == 'ci: publish 1.1.1 automatically' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify release version
        run: |
          test "$(cat VERSION)" = "1.1.1"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/v1.1.1" >/dev/null; then
            test "$(git rev-list -n1 v1.1.1)" = "$GITHUB_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a v1.1.1 "$GITHUB_SHA" -m "SIDINET Dashboard v1.1.1"
            git push origin v1.1.1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish multiarch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sidinet-apps/sidinet-dashboard-docker:1.1.1
            ghcr.io/sidinet-apps/sidinet-dashboard-docker:latest
          build-args: |
            VERSION=1.1.1
            COMMIT=${{ github.sha }}
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: SIDINET Dashboard v1.1.1
          prerelease: false
          make_latest: true
          generate_release_notes: true
