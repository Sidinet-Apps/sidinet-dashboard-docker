name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: go test ./...
      - run: go build ./cmd/dashboard && go build ./cmd/docker-proxy
