name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'
          cache: false

      - name: Install SQLite development library
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev sqlite3

      - name: Run tests
        run: go test ./...
      - name: Check frontend JavaScript
        run: node --check internal/webassets/web/static/js/app.js


      - name: Build dashboard
        run: go build ./cmd/dashboard

      - name: Build Docker proxy
        run: go build ./cmd/docker-proxy

      - name: Full persistent /data container recreation test
        run: bash scripts/test-persistence.sh
