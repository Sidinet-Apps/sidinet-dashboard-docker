name: Publish 1.1.2 once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-1.1.2-once.yml']
permissions:
  contents: write
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Tag release
        run: |
          test "$(cat VERSION)" = "1.1.2"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          git rev-parse -q --verify refs/tags/v1.1.2 >/dev/null || (git tag -a v1.1.2 "$GITHUB_SHA" -m "SIDINET Dashboard v1.1.2" && git push origin v1.1.2)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/sidinet-apps/sidinet-dashboard-docker:1.1.2
            ghcr.io/sidinet-apps/sidinet-dashboard-docker:latest
          build-args: |
            VERSION=1.1.2
            COMMIT=${{ github.sha }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.2
          name: SIDINET Dashboard v1.1.2
          prerelease: false
          make_latest: true
          generate_release_notes: true
