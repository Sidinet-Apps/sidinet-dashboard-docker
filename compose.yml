# SIDINET Dashboard Docker - deployment for an EXISTING Docker/Compose installation.
# This file does NOT install Docker or OpenMediaVault.
services:
  sidinet-dashboard:
    image: "${SIDINET_IMAGE:-ghcr.io/CHANGE_ME/sidinet-dashboard-docker:latest}"
    container_name: sidinet-dashboard
    restart: unless-stopped
    ports:
      - "${SIDINET_PORT:-8585}:8080"
    environment:
      TZ: "${TZ:-America/Mexico_City}"
      SIDINET_DATA_DIR: /data
      SIDINET_LOG_LEVEL: "${SIDINET_LOG_LEVEL:-INFO}"
      SIDINET_SAFE_MODE: "${SIDINET_SAFE_MODE:-false}"
      SIDINET_DOCKER_ENABLED: "${SIDINET_DOCKER_ENABLED:-true}"
      SIDINET_DOCKER_HOST: "http://docker-proxy:2375"
      SIDINET_PERFORMANCE_PROFILE: "${SIDINET_PERFORMANCE_PROFILE:-balanced}"
      SIDINET_HOST_RESOLV_CONF: /host/etc/resolv.conf
      SIDINET_INTERNET_TARGET: "${SIDINET_INTERNET_TARGET:-1.1.1.1:53}"
      SIDINET_STORAGE_PATHS: "${SIDINET_STORAGE_PATHS:-/data}"
    volumes:
      - "${SIDINET_DATA_DIR:-./data}:/data"
      - /proc:/host/proc:ro
      - /sys/class/thermal:/host/sys/class/thermal:ro
      - /etc/resolv.conf:/host/etc/resolv.conf:ro
      # Optional host/NAS paths: mount each read-only and add its container path to SIDINET_STORAGE_PATHS.
      # - /srv/dev-disk-by-uuid-XXXX:/host/storage/data:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.50
    depends_on:
      - docker-proxy
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
    networks: [dashboard, sidinet-internal]

  docker-proxy:
    image: "${SIDINET_IMAGE:-ghcr.io/CHANGE_ME/sidinet-dashboard-docker:latest}"
    container_name: sidinet-dashboard-docker-proxy
    restart: unless-stopped
    entrypoint: ["/app/sidinet-docker-proxy"]
    command: ["-listen", ":2375", "-socket", "/var/run/docker.sock"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "${DOCKER_GID:-999}"
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 40
    mem_limit: 64m
    cpus: 0.10
    networks: [sidinet-internal]

networks:
  dashboard:
  sidinet-internal:
    internal: true
