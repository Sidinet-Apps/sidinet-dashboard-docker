<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>SIDINET Dashboard</title>
    <link rel="icon" href="/assets/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/assets/static/css/app.css">
</head>

<body>
<div class="appShell">

    <aside class="sidebar">
        <div class="brand">
            <div class="brandMark">S</div>
            <div>
                <strong id="dashboardName">SIDINET</strong>
                <span>Dashboard</span>
            </div>
        </div>

        <nav id="pages" class="sidebarNav"></nav>

        <div class="sidebarBottom">
            <button id="theme" class="sidebarButton" type="button">Apariencia</button>
            <button id="renameDashboard" class="sidebarButton" type="button">Nombre del dashboard</button>

            <button id="kiosk" class="sidebarButton" type="button">
                Kiosk
            </button>
        </div>
    </aside>

    <div class="workspace">

        <header class="topbar">
            <div class="searchBox">
                <input
                    id="search"
                    type="search"
                    placeholder="Buscar aplicaciones, páginas..."
                    aria-label="Buscar"
                >
            </div>

            <div id="dateTime" class="dateTime" aria-label="Fecha y hora"></div>
            <span id="status" class="connectionStatus">Conectando...</span>
        </header>

        <main>

            <section class="pageHeader">
                <div>
                    <h1 id="pageTitle">Inicio</h1>
                    <p>Acceso rápido a tus aplicaciones y servicios.</p>
                </div>

                <div class="pageActions">
                    <button id="addPage" type="button">+ Página</button>
                    <button id="edit" class="primaryButton" type="button">Editar</button>
                    <button id="store" class="primaryButton" type="button">+ Agregar</button>
                    <button id="discover" type="button" hidden>Docker</button>
                </div>
            </section>

            <section id="editor" class="editorBar" hidden>
                <label>
                    Vista
                    <select id="breakpoint">
                        <option value="desktop">Desktop</option>
                        <option value="tablet">Tablet</option>
                        <option value="mobile">Móvil</option>
                    </select>
                </label>

                <div class="editorActions">
                    <button id="undo" type="button">Deshacer</button>
                    <button id="redo" type="button">Rehacer</button>
                    <button id="cancel" type="button">Cancelar</button>
                    <button id="save" class="primaryButton" type="button">
                        Guardar
                    </button>
                </div>
            </section>

            <section id="searchResults" class="searchResults" hidden></section>

            <section class="dashboardSection">

                <section id="grid" class="grid"></section>
            </section>

        </main>

    </div>

</div>
<footer class="sidinetCredit">Dashboard By Sidinet Consultoría Digital y Sistemas<br>Derechos Reservados</footer>

<dialog id="modal">
    <div id="modalBody"></div>
    <button id="closeModal" type="button">Cerrar</button>
</dialog>

<script src="/assets/static/js/app.js" defer></script>
</body>
</html>
